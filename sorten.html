<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌶 Chili-Sorten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0d0f0a; --surface:#13160e; --surface2:#1a1f12; --border:#2a3020; --text:#dde5c8; --muted:#7a8a60; --accent:#c8e060; --accent2:#e05a20; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .topbar{position:sticky;top:0;z-index:100;background:rgba(13,15,10,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 40px;height:56px;display:flex;align-items:center;gap:16px;}
  .back-link{font-family:'DM Mono',monospace;font-size:0.78rem;color:var(--accent);text-decoration:none;}
  .back-link:hover{opacity:0.7;}
  #sortCount{margin-left:auto;font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--muted);}
  .container{max-width:1100px;margin:0 auto;padding:60px 40px;}
  .label{font-family:'DM Mono',monospace;font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:block;}
  h1{font-family:'Playfair Display',serif;font-size:clamp(2.5rem,5vw,4rem);line-height:1.05;font-weight:700;margin-bottom:40px;}
  h1 em{color:var(--accent2);font-style:italic;}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;}
  .filter-btn{font-family:'DM Mono',monospace;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;padding:6px 16px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;}
  .filter-btn:hover,.filter-btn.active{border-color:rgba(200,224,96,.4);color:var(--accent);background:rgba(200,224,96,.07);}
  .sort-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
  .sort-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .3s,transform .2s;animation:fadeIn .4s ease both;}
  .sort-card:hover{border-color:rgba(200,224,96,.3);transform:translateY(-2px);}
  .sort-card-header{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .sort-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;line-height:1.2;}
  .sort-species{font-family:'DM Mono',monospace;font-size:0.63rem;color:var(--muted);margin-top:5px;font-style:italic;}
  .heat-scale{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
  .heat-dots{display:flex;gap:3px;}
  .heat-dot{width:7px;height:7px;border-radius:50%;background:var(--border);}
  .lit-1{background:#c8e060;} .lit-2{background:#f0b840;} .lit-3{background:#e07020;} .lit-4{background:#e03020;} .lit-5{background:#c01010;}
  .heat-label{font-family:'DM Mono',monospace;font-size:0.6rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
  .sort-card-body{padding:16px 22px 18px;flex:1;}
  .sort-desc{font-size:.85rem;color:rgba(221,229,200,.8);line-height:1.7;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
  .sort-desc.expanded{display:block;-webkit-line-clamp:unset;}
  .expand-btn{background:none;border:none;font-family:'DM Mono',monospace;font-size:.68rem;color:var(--accent);cursor:pointer;margin-top:8px;padding:0;display:block;}
  .sort-card-footer{padding:12px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .sort-link{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--accent);text-decoration:none;}
  .sort-link:hover{opacity:.7;}
  .origin-tag{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--muted);}
  .no-results{display:none;text-align:center;padding:60px;color:var(--muted);font-family:'DM Mono',monospace;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @media(max-width:600px){.container{padding:40px 20px}.topbar{padding:0 20px}.sort-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back-link">← Zurück</a>
  <div id="sortCount"></div>
</div>

<div class="container">
  <span class="label">Saison 2026</span>
  <h1>Chili<br><em>Sorten</em></h1>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">Alle</button>
    <button class="filter-btn" data-filter="chinense">C. chinense</button>
    <button class="filter-btn" data-filter="annuum">C. annuum</button>
    <button class="filter-btn" data-filter="baccatum">C. baccatum</button>
    <button class="filter-btn" data-filter="mild">Mild (≤3)</button>
    <button class="filter-btn" data-filter="hot">Scharf (≥7)</button>
  </div>

  <div class="sort-grid" id="sortGrid"></div>
  <div class="no-results" id="noResults">Keine Sorten gefunden.</div>
</div>

<script>
var sorten=[
  {name:"Aji Margaritena",species:"Capsicum chinense",heat:1,origin:"USA",desc:"Tolles Aroma schon beim Aufschneiden — Ananas und viel süße Frucht. Bauchige, gebuchtete Früchte mit nur leichter Schärfe. Ein Chili für den Frischgenuss. Als Zufallssämling in den USA gefunden.",link:"https://deaflora.de/Shop/Chili/Chili-Aji-Margariteno.html?language=de"},
  {name:"Biquinho Amarelo",species:"Capsicum chinense",heat:1,origin:"Brasilien",desc:"Niedliche Tropfenform — ein Überangebot an Früchten! Fantastisch fruchtig, süß mit ganz leichter Schärfe. Am besten frisch essen. Bedeutet 'kleiner gelber Schnabel'. Reift von hellgrün zu sattgelb.",link:"https://deaflora.de/Shop/Chili/Gemuesechili-Biquinho-Amarelo-8668.html?language=de"},
  {name:"Dulce Estrella",species:"Capsicum baccatum",heat:2,origin:"Eigenauslese",desc:"Köstliche Eigenauslese. Glockenförmige Früchte mit kussmund-förmiger Spitze in sanftem Hellgelb. Sehr fruchtig und saftig. Pflanzen bis 1,20 m hoch, gedeihen auch im Halbschatten.",link:"https://deaflora.de/Shop/Chili/Chili-Dulce-Estrella.html"},
  {name:"Dulce Sol",species:"Capsicum baccatum",heat:1,origin:"Eigenauslese",desc:"Dulce bedeutet süß — und süß schmeckt er wirklich. Geringe Schärfe, schmackhaftes Aroma. Strahlendes goldgelbes Äußeres. Eine überaus leckere Raritätensorte.",link:"https://deaflora.de/Shop/Chili/Chili-Dulce-Sol.html"},
  {name:"Elephants Trunk Red",species:"Capsicum annuum",heat:5,origin:"Indien",desc:"'Elefantenrüssel' aus Indien. Pflanzen bis 1,20 m, Früchte 15–25 cm lang. Sehr aromatisch, besonders gut mit Frischkäse füllen oder einlegen. Eignet sich auch zum Kochen und Grillen.",link:"https://www.chili-shop24.de/chili-zucht/chili-samen/schaerfegrad-4-6/1579/elephants-trunk-red-chili-samen"},
  {name:"Habanada",species:"Capsicum chinense",heat:0,origin:"USA",desc:"Null Schärfe bei vollem Habanero-Aroma! Wurde zur begehrtesten Sorte. Orange-apricot Früchte, schön groß. Kompakte Pflanzen mit 40 cm. Gezüchtet von Michael Mazourek.",link:"https://deaflora.de/Shop/Chili/Chili-Habanada.html"},
  {name:"Habanero El Remo",species:"Capsicum chinense",heat:9,origin:"Karibik",desc:"Typisches intensives Habanero-Fruchtaroma kombiniert mit kräftiger Schärfe. Klassische Habanero-Eigenschaften mit fruchtigen Noten.",link:"#"},
  {name:"Mattapeno",species:"Capsicum annuum",heat:5,origin:"USA",desc:"Außergewöhnliche Jalapeño-Variante mit weiß-grün gestreiften Früchten und bunten Blättern. Keine Kreuzung, sondern eine stabile Mutation. Früchte fest, dickwandig und lecker.",link:"https://deaflora.de/Shop/Chili/Chili-Mattapeno--panaschiert-.html"},
  {name:"Nadapeno",species:"Capsicum annuum",heat:0,origin:"USA",desc:"Klassischer Jalapeño — aber ohne Schärfe. Sehr würziger Geschmack, auch für Kinder geeignet. Dickwandige, saftige Früchte mit typischen Korkrissen — Qualitätszeichen!",link:"https://deaflora.de/Shop/Chili/Chili-Nadapeno.html"},
  {name:"Naga Dorset",species:"Capsicum chinense",heat:10,origin:"Bangladesch",desc:"Eine der schärfsten Chili-Sorten der Welt. Britische Zuchtlinie der Naga Morich aus Bangladesch. Extrem scharf mit fruchtigen Noten.",link:"https://de.wikipedia.org/wiki/Dorset_Naga"},
  {name:"Pink Habanero",species:"Capsicum chinense",heat:2,origin:"Unbekannt",desc:"Lachsorangefarbener Habanero — aber ohne beißende Schärfe. Grandios: sonnig-fruchtig-warm mit kleiner Spur Schärfe. Pflanzen tragen reichlich. Lieblingschili 2019.",link:"https://deaflora.de/Shop/Chili/Chili-Pink-Habanero.html"},
  {name:"Scotch Bonnet MOA Yellow",species:"Capsicum chinense",heat:9,origin:"Karibik",desc:"Gelb-orange Variante der Scotch Bonnet. Eine der schärfsten Chilis der Welt. Außergewöhnlich tropisch-fruchtiges Aroma, teils an Aprikosen erinnernd. Essentiell in der karibischen Küche.",link:"https://www.chili-shop24.de/chili-zucht/chili-samen/grossmengen-bio-chilisamen/19680/bio-scotch-bonnet-moa-yellow-chili-samen-1000-stk."},
  {name:"Shabu Shabu",species:"Capsicum chinense",heat:9,origin:"China",desc:"Wächst wild in China, Region Tengchong. Leuchtend rot, sehr scharf, ähnlich einer Naga Jolokia. Traditionell mit Stäbchen in heiße Suppe getaucht.",link:"https://www.chili-shop24.de/chili-zucht/chili-samen/schaerfegrad-9-10/4556/shabu-shabu-chili-samen"},
  {name:"Somborcka",species:"Capsicum annuum",heat:3,origin:"Kosovo",desc:"Dickfleischige Landsorte aus dem Kosovo. Früchte reifen von hellgelb auf rot. In der Balkan-Heimat gerne gefüllt und eingelegt. Manchmal richtig peppig — Überraschungseffekt!",link:"https://www.pepperworldhotshop.com/de/produkte/somborcka-chilisamen/"},
  {name:"Sweet Bonnet",species:"Capsicum chinense",heat:1,origin:"Karibik",desc:"Superlecker, ganz leicht scharf, unglaubliches Aroma! Scotch-Bonnet-Verwandter ohne Waffenscheinpflicht. Früchte wie kleine Blümchen. Hoher Ertrag, frühe Reife.",link:"https://deaflora.de/Shop/Chili/neu-chili-sweet-bonnet-schaerfe-1-samen.html"},
  {name:"Trinidad Scorpion Moruga Chocolate",species:"Capsicum chinense",heat:10,origin:"Karibik",desc:"Schokobraune Variante der Trinidad Scorpion Moruga. Ebenso scharf, am Stachel erkennbar. Sehr aromatisch, fruchtig, etwas rauchiger als andere Sorten.",link:"https://www.chili-shop24.de/chili-zucht/chili-samen/schaerfegrad-9-10/4532/trinidad-scorpion-moruga-chocolate-chili-samen"},
  {name:"Uba Tuba Gambaei",species:"Capsicum baccatum",heat:7,origin:"Brasilien",desc:"Aus Brasilien. Große verzweigte Pflanzen bis 2 Meter. Früchte in kurioser Form, ähnlich Bishops Crown. Saftig, dickfleischig, fruchtig. Frisch, gekocht oder getrocknet.",link:"https://www.chili-shop24.de/chili-zucht/chili-samen/schaerfegrad-7-8/1467/uba-tuba-gambuci-chili-samen"},
  {name:"Vicentes Sweet Habanero",species:"Capsicum chinense",heat:0,origin:"Unbekannt",desc:"Keinerlei Schärfe, volles Habaneroaroma! Mehr Zitrus, Pfirsich, tropische Früchte. Herzförmige Früchte mit vielen Rillen, hellrot, ca. 6 cm. Geschmacksknaller 2014.",link:"https://deaflora.de/Shop/Chili/Chili-Vicentes-Sweet-Habanero.html"}
];

function heatDots(h){var s='';for(var i=1;i<=10;i++){var c='heat-dot';if(i<=h){if(h<=2)c+=' lit-1';else if(h<=4)c+=' lit-2';else if(h<=6)c+=' lit-3';else if(h<=8)c+=' lit-4';else c+=' lit-5';}s+='<div class="'+c+'"></div>';}return s;}
function heatLabel(h){if(h===0)return'Keine Schärfe';if(h<=2)return'Mild';if(h<=4)return'Leicht';if(h<=6)return'Mittel';if(h<=8)return'Scharf';return'Extrem';}

function renderCards(filter){
  var grid=document.getElementById('sortGrid');
  var noRes=document.getElementById('noResults');
  var countEl=document.getElementById('sortCount');
  var filtered=sorten.filter(function(s){
    if(filter==='all')return true;
    if(filter==='chinense')return s.species.indexOf('chinense')>-1;
    if(filter==='annuum')return s.species.indexOf('annuum')>-1;
    if(filter==='baccatum')return s.species.indexOf('baccatum')>-1;
    if(filter==='mild')return s.heat<=3;
    if(filter==='hot')return s.heat>=7;
    return true;
  });
  countEl.textContent=filtered.length+' Sorten';
  if(filtered.length===0){grid.innerHTML='';noRes.style.display='block';return;}
  noRes.style.display='none';
  grid.innerHTML=filtered.map(function(s,i){
    return '<div class="sort-card" style="animation-delay:'+(i*0.04)+'s">'
      +'<div class="sort-card-header"><div><div class="sort-name">'+s.name+'</div><div class="sort-species">'+s.species+'</div></div>'
      +'<div class="heat-scale"><div class="heat-dots">'+heatDots(s.heat)+'</div><div class="heat-label">'+heatLabel(s.heat)+'</div></div></div>'
      +'<div class="sort-card-body"><div class="sort-desc" id="d'+i+'">'+s.desc+'</div>'
      +'<button class="expand-btn" onclick="ex('+i+')">Mehr lesen</button></div>'
      +'<div class="sort-card-footer"><a href="'+s.link+'" class="sort-link" target="_blank" rel="noopener">Quelle →</a>'
      +'<span class="origin-tag">'+s.origin+'</span></div></div>';
  }).join('');
}

function ex(i){var el=document.getElementById('d'+i);var btn=el.nextElementSibling;el.classList.toggle('expanded');btn.textContent=el.classList.contains('expanded')?'Weniger':'Mehr lesen';}

document.querySelectorAll('.filter-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');renderCards(btn.dataset.filter);
  });
});

renderCards('all');
</script>
</body>
</html>
